---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: dappinventories.cache.orca.com
spec:
  group: cache.orca.com
  names:
    kind: DappInventory
    listKind: DappInventoryList
    plural: dappinventories
    singular: dappinventory
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DappInventory is the per-node dApp inventory, named after the
          node.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DappInventorySpec is the desired per-node dApp inventory,
              written by ORCA.
            properties:
              entries:
                description: |-
                  Entries are the dApps admitted on the node. A dApp that leaves the spec is to be
                  withdrawn by the Gateway.
                items:
                  description: DappInventoryEntry is one dApp admitted on the node.
                    ORCA writes it.
                  properties:
                    dapp:
                      description: Dapp is the DappManifest this entry belongs to.
                      properties:
                        name:
                          description: Name of the DappManifest.
                          type: string
                        namespace:
                          description: Namespace of the DappManifest.
                          type: string
                      required:
                      - name
                      - namespace
                      type: object
                    dappId:
                      description: DappID is the E3 dApp ID reserved for the dApp
                        on this node, unique per node.
                      format: int32
                      maximum: 100
                      minimum: 1
                      type: integer
                    generation:
                      description: |-
                        Generation is the rotation counter: it starts at 1 and is bumped on every token rotation.
                        The Gateway reports Registered and Advertised for this generation.
                      format: int64
                      type: integer
                    tokenHash:
                      description: |-
                        TokenHash is the SHA-256 hex hash of the dApp's current E3 token. The token itself
                        is only in a Secret mounted into the dApp pod.
                      pattern: ^[0-9a-f]{64}$
                      type: string
                  required:
                  - dapp
                  - dappId
                  - generation
                  - tokenHash
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - dappId
                x-kubernetes-list-type: map
            type: object
          status:
            description: DappInventoryStatus is the observed per-node inventory, written
              by the Gateway.
            properties:
              entries:
                description: |-
                  Entries hold one entry per dApp ID the Gateway knows of. The Gateway writes an entry
                  before it accepts an E3 Setup for the ID, and removes it only after it withdrew the
                  dApp from the RIC, which confirms the withdrawal to ORCA.
                items:
                  description: DappInventoryEntryStatus is the Gateway's observed
                    state of one dApp ID.
                  properties:
                    advertised:
                      description: Advertised is true once the RIC acknowledged the
                        RIC Service Update that adds the dApp.
                      type: boolean
                    dappId:
                      description: DappID is the dApp ID this status entry reports
                        on.
                      format: int32
                      maximum: 100
                      minimum: 1
                      type: integer
                    generation:
                      description: Generation is the spec entry generation the Gateway
                        observed.
                      format: int64
                      type: integer
                    registered:
                      description: Registered is true once the Gateway accepted the
                        dApp's E3 Setup with the reserved ID.
                      type: boolean
                  required:
                  - advertised
                  - dappId
                  - generation
                  - registered
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - dappId
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
