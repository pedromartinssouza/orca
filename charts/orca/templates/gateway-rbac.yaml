apiVersion: v1
kind: ServiceAccount
metadata:
  name: orca-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orca.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "orca.fullname" . }}-gateway
  labels:
    {{- include "orca.labels" . | nindent 4 }}
rules:
- apiGroups: ["cache.orca.com"]
  resources: ["dappinventories"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["cache.orca.com"]
  resources: ["dappinventories/status"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "orca.fullname" . }}-gateway
  labels:
    {{- include "orca.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "orca.fullname" . }}-gateway
subjects:
- kind: ServiceAccount
  name: orca-gateway
  namespace: {{ .Release.Namespace }}
