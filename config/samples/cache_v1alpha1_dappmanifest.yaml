apiVersion: cache.orca.com/v1alpha1
kind: DappManifest
metadata:
  labels:
    app.kubernetes.io/name: orca
    app.kubernetes.io/managed-by: kustomize
  namespace: default
  name: dappmanifest-sample
spec:
  dappName: my-dapp
  namespace: my-dapp-system
  helm:
    releaseName: my-dapp
    chartName: podinfo
    version: ">=6.0.0"
    repoURL: https://stefanprodan.github.io/podinfo
  # nodeName pins the dApp to one exact node (immutable once set).
  # Must be the exact name of the target O-DU/O-CU node (kubectl get nodes -l type=o-du).
  nodeName: ocudu-sandbox-worker2
  tolerations:
  - key: dedicated
    operator: Equal
    value: o-du
    effect: NoSchedule
