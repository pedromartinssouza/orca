apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: orca
    app.kubernetes.io/managed-by: kustomize
  name: gateway-role
rules:
- apiGroups: ["cache.orca.com"]
  resources: ["dappinventories"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["cache.orca.com"]
  resources: ["dappinventories/status"]
  verbs: ["get", "patch"]
