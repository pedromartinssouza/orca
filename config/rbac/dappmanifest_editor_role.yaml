# This rule is not used by the project orca itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the cache.orca.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: orca
    app.kubernetes.io/managed-by: kustomize
  name: dappmanifest-editor-role
rules:
- apiGroups:
  - cache.orca.com
  resources:
  - dappmanifests
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cache.orca.com
  resources:
  - dappmanifests/status
  verbs:
  - get
